apiVersion: apps/v1
kind: Deployment
metadata:
  name: secure-cicd-demo
  labels:
    app: secure-cicd-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: secure-cicd-demo
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0       # zero-downtime: always keep current replicas up
  template:
    metadata:
      labels:
        app: secure-cicd-demo
    spec:
      # Security: never run as root inside the pod
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000

      containers:
      - name: app
        # Jenkins replaces IMAGE_PLACEHOLDER via sed before kubectl apply
        image: IMAGE_PLACEHOLDER
        imagePullPolicy: Always
        ports:
        - containerPort: 8080

        # Resource limits: prevent one pod starving the node
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"

        # Readiness: pod gets traffic only when this passes
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 10

        # Liveness: pod is restarted if this fails
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 20

        # Security: lock down the container filesystem
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]

        # Writable tmp dir needed by Spring Boot
        volumeMounts:
        - name: tmp
          mountPath: /tmp

      volumes:
      - name: tmp
        emptyDir: {}
