# SonarQube project configuration
# Used when running: mvn sonar:sonar from the app/ directory

sonar.projectKey=secure-cicd-demo
sonar.projectName=Secure CI/CD Demo
sonar.projectVersion=1.0

# Source and test directories
sonar.sources=src/main/java
sonar.tests=src/test/java

# JaCoCo coverage report path (generated by mvn test)
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

# Java version
sonar.java.source=21
sonar.java.target=21

# Compiled classes for deeper analysis
sonar.java.binaries=target/classes
sonar.java.test.binaries=target/test-classes
